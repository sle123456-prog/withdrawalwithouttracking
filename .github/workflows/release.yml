name: Release

# Pushing a tag like v1.1.0 publishes a GitHub Release with the extension zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Package extension
        run: zip -qr "relay-wallet-extension-$GITHUB_REF_NAME.zip" extension

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Chrome extension that generates a one-time EVM relay address for each exchange withdrawal and forwards received funds to your destination address.

          ## Install

          1. Download the zip below and unzip it. Keep the `extension` folder somewhere permanent.
          2. Open `chrome://extensions` and turn on **Developer mode**.
          3. Click **Load unpacked** and select the `extension` folder.

          To update, overwrite the folder with the new files and click the reload button on `chrome://extensions`. Do not remove the extension first: that erases the stored private keys.

          See [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.en.md) ([中文](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)) for usage, gas handling and limitations. Test with a small amount first.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" "relay-wallet-extension-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
